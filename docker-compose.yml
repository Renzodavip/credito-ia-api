services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creditoia
      POSTGRES_USER: creditoia
      POSTGRES_PASSWORD: creditoia
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditoia"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/creditoia
    extra_hosts:
      - "host.docker.internal:host-gateway"
